<p>The Deno team is joining Cloudflare to radically simplify self-hosting Workers and Durable Objects so developers can use the same primitives in more places.</p>
<p>For what this means and how it came about, here’s the story from Ryan Dahl and Kenton Varda.</p>

			<div>
				<cite class="announcement-quote__name" style="font-family:'Inter Tight'">Ryan Dahl</cite>
				<span class="announcement-quote__company">Deno (and now Cloudflare)</span>
			</div>

		<div class="announcement-quote__frame">
			<div class="announcement-quote__text">

				<p>The Deno team is joining Cloudflare, and we're merging workerd and celld! For more on what's happening to the Deno runtime and our various efforts, <a href="https://deno.com/blog/cloudflare">see my post on the Deno blog.</a></p>

				<p>Long ago, I stood in a Berlin warehouse and introduced Node.js with a 500-line JavaScript IRC server and live audience participation. Node.js was an exploration of what a purely asynchronous programming model could enable. Async I/O was already known to be important for fast servers, but it was difficult to wield. Removing sync networking made it easier to build systems that previously required much more machinery. What made the IRC demo exciting was how little code it took.</p>

				<p>I started Deno to find more powerful abstractions like this — looking for places where we could simplify and remove capabilities while giving engineers ever more power. With Deno, we improved the experience of writing JavaScript, but we didn’t fundamentally change what developers had to assemble around the runtime. The bigger problems are around networked applications: distributing computation, coordinating state, data storage in general, and autoscaling to meet demand.</p>

				<p>Something about that old IRC demo has always bothered me — it was a single server, single thread even. It could handle many user connections, but it would start getting slow if you had too many. Scaling IRC eventually means multiple machines with the channels shared across them. A modern chat app also needs to store message history, user accounts, and other data.</p>

				<p>Could the programming model make partitioning across machines part of the design from the start?</p>

				<p>The solution clicked into focus when I read about Cloudflare's Durable Objects. It provided a very powerful abstraction: the distributed singleton with a SQLite database. Each Durable Object is like a small, individually addressable server with its own relational database. Its JavaScript execution is single-threaded (which is easy to reason about), it handles WebSockets, and its local SQLite database can be accessed synchronously. By building a chat application using one DO per channel, you have sharded your data and WebSocket connections, and thus made your application scalable.</p>

				<p>Much more than chat can be built with DOs. On top of this abstraction other services can be built: Queues, KV, Durable Execution (CF's Workflow API), even <a href="https://github.com/littledivy/durable-git">Git storage.</a> The Durable Object abstraction is simple yet incredibly powerful.</p>

				<p>But running this model outside of Cloudflare has remained difficult. Cloudflare’s network is great — but there are a million reasons one might want to run it themselves. Workerd is already open source, but its Durable Objects support is limited to a single instance. What I wanted was the distributed version: IRC channels spread across machines, with the platform handling placement, routing, and durable storage. The power of this abstraction is how it scales. That's why I started celld.</p>

				<p>Building and operating Deno Deploy taught me how complicated cloud infrastructure could become: multiple public clouds, multiple databases, and deeply entangled services. With celld, I wanted the opposite: one binary, written in Rust, with object storage as its only external service dependency.</p>

				<p>What excites me is the leverage this model gives developers: compute, relational databases, queues, and real-time communication primitives designed for applications distributed across machines. To run it, you manage many instances of celld and a single object storage bucket. Your application can contain many services without each requiring a separate infrastructure project. This is much closer to the simplicity I've been chasing since that first Node.js demo.</p>

				<p>We’re joining Cloudflare to make the Workers programming model a mainstream way to build servers. By bringing celld and workerd together, we want it to be radically easy to build and operate distributed applications on your own infrastructure.</p>

		<figcaption class="announcement-quote__author" style="padding-top:20px;margin-bottom:-10px">
			<img class="announcement-quote__portrait" src="https://blog.cloudflare.com/_image?href=https%3A%2F%2Fblog.cloudflare.com%2F_emdash%2Fapi%2Fmedia%2Ffile%2F01KW44DEXVTQSPFW8ZSKE70KPZ.jpg&amp;w=140&amp;h=140&amp;f=webp&amp;fit=cover&amp;position=center" alt="" width="48" height="48" style="margin-bottom:0">
			<div>
				<cite class="announcement-quote__name" style="font-family:'Inter Tight'">Kenton Varda</cite>
				<span class="announcement-quote__company">Cloudflare</span>
			</div>
		</figcaption>
		<div class="announcement-quote__frame">
			<div class="announcement-quote__text">

				<p>This may come as a surprise to some, but when the Deno team released <a href="https://celld.dev">celld</a> in August, we were delighted.</p>

				<p>Why a surprise? Well, as it happens, there is a popular theory that suggests we shouldn't be happy.</p>

				<p>You see, it is commonly claimed around the Internet that we made Cloudflare Workers work differently from other cloud platforms in order to create "lock-in." The claim goes, software built on Workers is hard to move to other hosting platforms, therefore if you write your app on Workers you are "trapped" on Cloudflare forever. This is especially true of apps that use Durable Objects: they are not just written differently but architected differently. All this is, supposedly, a clever trap: once you are too deep to be able to switch, the rug will somehow be pulled out from under you.</p>

				<p>Under this theory, celld is a threat: as an open-source implementation of Workers and Durable Objects, it allows applications built on Workers to seamlessly migrate to other providers. No more trap!</p>

				<h3>This theory is wrong</h3>

				<h5>Workers is different because it is better</h5>

				<p>We built Workers differently because we believe it is a better way to build web applications.</p>

				<ul>
					<li>The Workers design makes it dead simple and dirt cheap to manage an application that runs in hundreds of locations around the world, a feat which no other popular hosting platform has achieved. The pricing isn't a trick: we've genuinely created <a href="https://developers.cloudflare.com/workers/reference/how-workers-works">a novel architecture</a> that is more efficient than competitors, and we've passed on the savings to you.</li>

					<li><a href="https://blog.cloudflare.com/workers-environment-live-object-bindings">Workers' live environment design</a> (aka "bindings") simultaneously makes configuring access to external resources easier and more secure. Usually, those two things don't come together!</li>

					<li><a href="https://developers.cloudflare.com/durable-objects/concepts/what-are-durable-objects">Durable Objects</a> make it easy to build real-time collaboration and distributed systems that are difficult or impossible in a classical three-tier web architecture.</li>
				</ul>

				<p>In short, we believe we've simply created a better programming model for cloud software. But being better requires being different: we couldn't achieve these benefits while remaining perfectly compatible with existing platforms.</p>

				<p>If we could offer these benefits and be perfectly compatible with traditional cloud platforms, we absolutely would! It would be a great benefit to our business if every kind of compute workload could simply be lifted and shifted onto Workers. But the reality is, innovation sometimes requires doing things differently. We feel that, in the long run, it's better to be different and <em>better</em>, than to be the same as everyone else.</p>

				<h5>"Lock-in" actually hurts us — that's why we went open source</h5>

				<p>If there were truly no escape hatch from Workers, then some of our largest customers would never have signed on with us in the first place.</p>

				<p>When we originally pitched <a href="https://developers.cloudflare.com/cloudflare-for-platforms/workers-for-platforms">Workers for Platforms</a> to customers like <a href="https://shopify.engineering/how-we-built-oxygen">Shopify</a> in 2022, the feedback was clear: They couldn't possibly build on us unless the Workers Runtime was open source.</p>

				<p>And so, we open-sourced it. That's right: not a lot of people seem to know this, but the Cloudflare Workers Runtime, <a href="https://github.com/cloudflare/workerd">workerd</a>, is <a href="https://blog.cloudflare.com/workerd-open-source-workers-runtime">open source</a>. This is not a parallel implementation, it's the same code we run in production.</p>

				<p>As a matter of fact, we have former customers that migrated away from us by using workerd. And that's OK! Those customers would never have signed with us in the first place if we hadn't been open source, and for every one that migrated away, there are many others that have stayed.</p>

				<p>It turns out, being open source and giving people an escape hatch is <em>good business.</em></p>

				<h3>But we could do better – and with Deno's help, we will</h3>

				<p>We released workerd genuinely intending for people to use it in production. A few have, but so far, not that many. Most people don't seem to have any idea that this is even possible.</p>

				<p>Why not?</p>

				<p>Frankly, we haven't done a great job of building out the ecosystem of adjacent services and tooling to make it really work. We'd released the runtime, and then we sort of just hoped the community would step in and start adapting it to every possible environment. It hasn't happened that way. Perhaps we were naive.</p>

				<p>In the interest of transparency, I do have to admit that workerd has always had one big gap in its production-readiness: Durable Objects. Workerd implements them, but only in a single-instance way, good enough for local testing, but unable to scale. We have always wanted to fix this. There are TODO comments in the code going back to the original release. The problem is, our production implementation of Durable Object routing is simply not the implementation any self-hoster would want. It's a beast, designed to handle hundreds of locations, with numerous dependencies on external services operated by a team of site reliability engineers. We knew we needed something different for the self-hosting use case, but we never quite found the time to build it. (I actually made an attempt last spring, but, embarrassingly, it didn't work.)</p>

				<p>So now, hopefully, it's clear why we were happy about celld: Here was an implementation of Workers and Durable Objects designed to be fully compatible with our own, while being focused on being self-hostable and scalable. That's what we'd wanted to build for a while, and Deno Land was building it for us!</p>

				<p>And who better to do it than Ryan Dahl and co? Ryan is the creator of Node.js. He invented the idea of using JavaScript on the server — without his work, Workers may never have existed. And then, he, Bert Belder, and the rest of the Deno Land crew did it again, creating Deno, another JavaScript (and TypeScript) runtime that further advanced the state of the art. The Deno team understands how to create a good developer experience around a self-hosted runtime — something we never quite cracked with workerd.</p>

				<p>Imagine, then, our excitement when the Deno team told us they'd like to join forces on this project.</p>

				<h3>The Plan</h3>

				<p>Ryan and Bert will be leading a new effort to make workerd self-hosting a first-class supported way to build and run apps using the Workers programming model. This will involve merging code and ideas from celld back into workerd. I'm incredibly excited for this work — I will personally be using it to host an instance of Cloudflare OS in my home.</p>

				<p>We'll have more announcements about this work in the coming months. But if you can't wait, you can start self-hosting celld or workerd today.</p>
